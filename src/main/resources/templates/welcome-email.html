<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${title}">Welcome</title>
  <style>
    body { margin: 0; padding: 0; background: #f6f7fb; color: #1f2937; font-family: Arial, Helvetica, sans-serif; }
    .container { max-width: 560px; margin: 24px auto; background: #ffffff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 24px; }
    .brand { font-weight: 700; font-size: 18px; color: #111827; }
    .title { margin: 16px 0 8px; font-size: 22px; font-weight: 700; }
    .message { margin: 0; white-space: pre-wrap; line-height: 1.5; }
    .footer { margin-top: 24px; font-size: 12px; color: #6b7280; }
  </style>
</head>
<body>
  <div class="container">
    <div class="brand">Resumade</div>
    <div class="title" th:text="${title}">Welcome to Resumade!</div>
    <p class="message" th:text="${message}">Thanks for joining. We are glad you are here.</p>
    <p class="footer">If you did not request this email, you can ignore it.</p>
  </div>
</body>
</html>
